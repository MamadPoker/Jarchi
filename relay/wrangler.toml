# Jarchi's Kick relay (see worker.mjs). Deploy from this folder: npx wrangler deploy
name = "jarchi-kick"
main = "worker.mjs"
compatibility_date = "2025-09-01"

# One Room per Kick channel. SQLite-backed, which the free plan needs (nothing is stored in it).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Usage pings (POST /ping): one row per install, see schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "jarchi-stats"
database_id = "510ef77f-2683-4c97-917b-637415415be6"

# No Workers Logs: Cloudflare keeps no record of these requests or their details (Kick tokens and login codes pass
# through here, see worker.mjs). Live `wrangler tail` still shows requests while it runs.
[observability]
enabled = false
