<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarchi</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo" aria-hidden="true">J</div><span data-i18n="title"></span></div>
    <button id="copy" class="primary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
      <span data-i18n="copyObs"></span>
    </button>
  </header>

  <div class="layout">
    <!-- Left column: groups of items, built in panel.js (GROUPS). Settings sits at the bottom. -->
    <aside class="side">
      <div id="groups" class="side-scroll"></div>
      <div class="side-foot">
        <div class="nav-row" data-view="settings">
          <button class="nav-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
            <span data-i18n="settings"></span>
          </button>
        </div>
      </div>
    </aside>

    <main>
      <!-- ===== One alert ===== -->
      <section class="view" data-view="alert" hidden>
        <div class="row between">
          <h1 class="title"><span class="dot"></span><span class="name"></span><span class="pill" data-only="off" data-i18n="off"></span></h1>
          <div class="row">
            <button id="test" data-i18n="testObs"></button>
            <button id="reset" class="ghost" data-i18n="resetAlert"></button>
          </div>
        </div>

        <div class="stage">
          <div class="preview"><iframe id="preview" src="/widgets/alerts/?preview" title="Alert preview" allow="autoplay"></iframe></div>
          <div class="stage-ctrl">
            <label class="pill-ctrl" data-only="amount"><span data-i18n="previewAmount"></span><input type="number" id="previewAmount" min="0" step="1"></label>
            <label class="pill-ctrl"><input type="checkbox" id="previewSound" checked><span data-i18n="previewSound"></span></label>
            <button id="play" class="primary">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
              <span data-i18n="play"></span>
            </button>
          </div>
        </div>

        <div class="box theme-pick">
          <h2 data-i18n="alertTheme"></h2>
          <span class="swatch" id="alertThemeSwatch"></span>
          <select id="alertTheme" aria-label="Theme"></select>
          <small data-i18n="alertThemeHint"></small>
        </div>

        <div class="basics">
          <div class="box">
            <h2 data-i18n="mediaTitle"></h2>
            <div class="file" data-kind="image">
              <span class="fname"></span>
              <div class="row">
                <button class="upload" data-i18n="upload"></button>
                <button class="ghost remove" data-i18n="remove"></button>
              </div>
              <input type="file" hidden accept="image/png,image/jpeg,image/gif,image/webp,video/webm,video/mp4,.webm,.mp4">
            </div>
            <small data-i18n="mediaHint"></small>
          </div>

          <div class="box">
            <h2 data-i18n="soundTitle"></h2>
            <div class="seg">
              <label><input type="radio" name="soundMode" data-f="soundMode" value="theme"><span data-i18n="soundTheme"></span></label>
              <label><input type="radio" name="soundMode" data-f="soundMode" value="custom"><span data-i18n="soundCustom"></span></label>
              <label><input type="radio" name="soundMode" data-f="soundMode" value="none"><span data-i18n="soundNone"></span></label>
            </div>
            <div class="file" data-kind="sound" data-only="customSound">
              <span class="fname"></span>
              <div class="row">
                <button class="upload" data-i18n="upload"></button>
                <button class="ghost remove" data-i18n="remove"></button>
              </div>
              <input type="file" hidden accept="audio/mpeg,audio/wav,audio/ogg,.mp3,.wav,.ogg">
              <small data-i18n="soundHint"></small>
            </div>
          </div>

          <div class="box">
            <h2 data-i18n="textTitle"></h2>
            <input type="text" data-f="template" maxlength="200" aria-label="Text">
            <small data-i18n="templateHint"></small>
          </div>
        </div>

        <details class="more">
          <summary>
            <span data-i18n="moreOptions"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </summary>
          <div class="more-grid">
            <div class="box">
              <h3 data-i18n="lookTitle"></h3>
              <div class="field">
                <span data-i18n="frame"></span>
                <div class="seg">
                  <label><input type="radio" name="frame" data-f="frame" value="theme"><span data-i18n="frameTheme"></span></label>
                  <label><input type="radio" name="frame" data-f="frame" value="custom"><span data-i18n="frameCustom"></span></label>
                  <label><input type="radio" name="frame" data-f="frame" value="off"><span data-i18n="frameOff"></span></label>
                </div>
              </div>
              <div class="cols" data-only="customFrame">
                <label class="field"><span data-i18n="frameBg"></span><input type="color" data-f="frameBg"></label>
                <label class="field"><span data-i18n="frameBorder"></span><input type="color" data-f="frameBorder"></label>
                <label class="field"><span><span data-i18n="frameOpacity"></span> <b data-out="frameOpacity"></b></span><input type="range" data-f="frameOpacity" min="0" max="1" step="0.05"></label>
                <label class="field"><span><span data-i18n="frameRadius"></span> <b data-out="frameRadius"></b></span><input type="range" data-f="frameRadius" min="0" max="60" step="1"></label>
              </div>
              <div class="row align-start">
                <div class="field">
                  <span data-i18n="textPos"></span>
                  <div class="seg">
                    <label><input type="radio" name="textPos" data-f="textPos" value="above"><span data-i18n="posAbove"></span></label>
                    <label><input type="radio" name="textPos" data-f="textPos" value="below"><span data-i18n="posBelow"></span></label>
                    <label><input type="radio" name="textPos" data-f="textPos" value="over"><span data-i18n="posOver"></span></label>
                  </div>
                </div>
                <div class="field">
                  <span data-i18n="textAlign"></span>
                  <div class="seg">
                    <label><input type="radio" name="textAlign" data-f="textAlign" value="left"><span data-i18n="alignLeft"></span></label>
                    <label><input type="radio" name="textAlign" data-f="textAlign" value="center"><span data-i18n="alignCenter"></span></label>
                    <label><input type="radio" name="textAlign" data-f="textAlign" value="right"><span data-i18n="alignRight"></span></label>
                  </div>
                </div>
              </div>
              <div class="cols">
                <label class="field"><span><span data-i18n="fontSize"></span> <b data-out="fontSize"></b></span><input type="range" data-f="fontSize" min="16" max="120" step="1"></label>
                <div class="field">
                  <span data-i18n="textColor"></span>
                  <div class="row">
                    <div class="seg">
                      <label><input type="radio" name="textColorMode" value="theme"><span data-i18n="colorTheme"></span></label>
                      <label><input type="radio" name="textColorMode" value="custom"><span data-i18n="colorCustom"></span></label>
                    </div>
                    <input type="color" class="swatch-input" data-f="textColor" data-only="customColor" aria-label="Text color">
                  </div>
                </div>
              </div>
            </div>

            <div class="box">
              <h3 data-i18n="playbackTitle"></h3>
              <div class="cols">
                <label class="field"><span data-i18n="duration"></span><input type="number" data-f="duration" min="1" max="60" step="0.5"></label>
                <label class="field"><span><span data-i18n="volume"></span> <b data-out="volume"></b></span><input type="range" data-f="volume" min="0" max="1" step="0.05"></label>
                <label class="field" data-only="minAmount"><span data-i18n="minAmount"></span><input type="number" data-f="minAmount" min="0" step="1"></label>
              </div>
              <small data-only="minAmount" data-i18n="scaleHint"></small>
              <div class="field" data-only="video">
                <span data-i18n="videoSound"></span>
                <div class="seg">
                  <label><input type="radio" name="videoSound" data-f="videoSound" value="off"><span data-i18n="videoSoundOff"></span></label>
                  <label><input type="radio" name="videoSound" data-f="videoSound" value="video"><span data-i18n="videoSoundVideo"></span></label>
                  <label><input type="radio" name="videoSound" data-f="videoSound" value="both"><span data-i18n="videoSoundBoth"></span></label>
                </div>
              </div>
            </div>
          </div>
        </details>
      </section>

      <!-- ===== One goal widget ===== -->
      <section class="view" data-view="goal" hidden>
        <div class="row between">
          <h1 class="title"><span class="dot"></span><span class="name"></span><span class="pill" data-only="off" data-i18n="off"></span></h1>
          <div class="row">
            <button id="goalCopy">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
              <span data-i18n="goalCopy"></span>
            </button>
            <button id="goalResetStyle" class="ghost" data-i18n="goalResetStyle"></button>
          </div>
        </div>
        <small><span id="goalCounts"></span> <span data-i18n="goalOffHint"></span></small>

        <div class="stage">
          <div class="preview goal-preview"><iframe id="goalPreview" title="Goal preview" allow="autoplay"></iframe></div>
          <div class="stage-ctrl">
            <button id="goalTest" class="primary">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span></span>
            </button>
          </div>
        </div>

        <div class="basics">
          <div class="box">
            <h2 data-i18n="goalTitle"></h2>
            <input type="text" data-f="title" maxlength="60" aria-label="Title">
          </div>
          <div class="box">
            <h2 data-i18n="goalTarget"></h2>
            <input type="number" data-f="target" min="1" step="1" aria-label="Target">
          </div>
          <div class="box">
            <h2 data-i18n="goalCurrent"></h2>
            <div class="stepper">
              <button id="goalMinus" aria-label="−">−</button>
              <input type="number" id="goalCurrent" min="0" step="1" aria-label="Current">
              <button id="goalPlus" aria-label="+">+</button>
            </div>
            <div><button id="goalZero" class="ghost" data-i18n="goalZero"></button></div>
          </div>
        </div>

        <div class="box">
          <div class="row between"><h2 data-i18n="goalStyle"></h2><small data-i18n="goalStyleHint"></small></div>
          <div id="styleGrid" class="style-grid"></div>
        </div>

        <div class="box">
          <h2 data-i18n="goalColors"></h2>
          <div class="cols4">
            <label class="field"><span data-i18n="barColor"></span><input type="color" data-f="barColor"></label>
            <label class="field"><span data-i18n="barBg"></span><input type="color" data-f="barBg"></label>
            <label class="field"><span data-i18n="goalText"></span><input type="color" data-f="textColor"></label>
            <label class="field"><span data-i18n="fullColor"></span><input type="color" data-f="fullColor"></label>
          </div>
        </div>

        <details class="more">
          <summary>
            <span data-i18n="moreOptions"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </summary>
          <div class="more-grid three">
            <div class="box">
              <h3 data-i18n="goalBox"></h3>
              <div class="field">
                <span data-i18n="bgMode"></span>
                <div class="seg">
                  <label><input type="radio" name="goalBg" data-f="bg" value="color"><span data-i18n="bgColor"></span></label>
                  <label><input type="radio" name="goalBg" data-f="bg" value="transparent"><span data-i18n="bgTransparent"></span></label>
                  <label><input type="radio" name="goalBg" data-f="bg" value="off"><span data-i18n="bgOff"></span></label>
                </div>
              </div>
              <div class="cols" data-only="bgColor">
                <label class="field"><span data-i18n="bgColor"></span><input type="color" data-f="bgColor"></label>
                <label class="field"><span><span data-i18n="bgOpacity"></span> <b data-out="bgOpacity"></b></span><input type="range" data-f="bgOpacity" min="0" max="1" step="0.05"></label>
              </div>
              <div class="stack" data-only="box">
                <label class="row between toggle-row"><span data-i18n="border"></span><span class="switch"><input type="checkbox" data-f="border"><span></span></span></label>
                <div class="cols" data-only="borderOn">
                  <label class="field"><span data-i18n="borderColor"></span><input type="color" data-f="borderColor"></label>
                  <label class="field"><span><span data-i18n="borderWidth"></span> <b data-out="borderWidth"></b></span><input type="range" data-f="borderWidth" min="1" max="12" step="1"></label>
                </div>
              </div>
              <label class="field"><span><span data-i18n="radius"></span> <b data-out="radius"></b></span><input type="range" data-f="radius" min="0" max="60" step="1"></label>
            </div>

            <div class="box">
              <h3 data-i18n="goalLook"></h3>
              <div class="cols">
                <label class="field"><span><span data-i18n="scale"></span> <b data-out="scale"></b></span><input type="range" data-f="scale" min="0.5" max="3" step="0.05"></label>
                <label class="field"><span><span data-i18n="fontSize"></span> <b data-out="fontSize"></b></span><input type="range" data-f="fontSize" min="12" max="120" step="1"></label>
              </div>
              <label class="field"><span data-i18n="font"></span><select id="goalFont" data-f="font"></select></label>
              <div class="field">
                <span data-i18n="titlePos"></span>
                <div class="seg">
                  <label><input type="radio" name="goalTitlePos" data-f="titlePos" value="above"><span data-i18n="tpAbove"></span></label>
                  <label><input type="radio" name="goalTitlePos" data-f="titlePos" value="below"><span data-i18n="tpBelow"></span></label>
                  <label><input type="radio" name="goalTitlePos" data-f="titlePos" value="inside"><span data-i18n="tpInside"></span></label>
                  <label><input type="radio" name="goalTitlePos" data-f="titlePos" value="hidden"><span data-i18n="tpHidden"></span></label>
                </div>
              </div>
              <label class="row between toggle-row"><span data-i18n="showPercent"></span><span class="switch"><input type="checkbox" data-f="showPercent"><span></span></span></label>
              <label class="row between toggle-row"><span data-i18n="showNumbers"></span><span class="switch"><input type="checkbox" data-f="showNumbers"><span></span></span></label>
            </div>

            <div class="box">
              <h3 data-i18n="celebration"></h3>
              <label class="row between toggle-row"><span data-i18n="celebrate"></span><span class="switch"><input type="checkbox" data-f="celebrate"><span></span></span></label>
              <div class="field">
                <span data-i18n="celebrateSound"></span>
                <div class="seg">
                  <label><input type="radio" name="goalSound" data-f="celebrateSound" value="theme"><span data-i18n="soundTheme"></span></label>
                  <label><input type="radio" name="goalSound" data-f="celebrateSound" value="custom"><span data-i18n="soundCustom"></span></label>
                  <label><input type="radio" name="goalSound" data-f="celebrateSound" value="none"><span data-i18n="soundNone"></span></label>
                </div>
              </div>
              <div class="file" data-kind="sound" data-only="goalCustomSound">
                <span class="fname"></span>
                <div class="row">
                  <button class="upload" data-i18n="upload"></button>
                  <button class="ghost remove" data-i18n="remove"></button>
                </div>
                <input type="file" hidden accept="audio/mpeg,audio/wav,audio/ogg,.mp3,.wav,.ogg">
                <small data-i18n="soundHint"></small>
              </div>
              <label class="field"><span><span data-i18n="volume"></span> <b data-out="volume"></b></span><input type="range" data-f="volume" min="0" max="1" step="0.05"></label>
            </div>
          </div>
        </details>
      </section>

      <!-- ===== Chat widget ===== -->
      <section class="view" data-view="chat" hidden>
        <div class="row between">
          <h1 class="title"><span class="dot"></span><span data-i18n="chatName"></span><span class="pill" data-only="off" data-i18n="off"></span></h1>
          <div class="row">
            <button id="chatCopy">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
              <span data-i18n="chatCopy"></span>
            </button>
            <button id="chatResetStyle" class="ghost" data-i18n="chatResetStyle"></button>
          </div>
        </div>
        <small data-i18n="chatHint"></small>

        <div class="basics two">
          <div class="box">
            <h2 class="row"><img class="plat-logo" src="/assets/platform-logos/kick.svg" alt=""><span data-i18n="kickChannel"></span></h2>
            <input type="text" data-f="kickChannel" maxlength="40" aria-label="Kick channel" data-placeholder="channelPlaceholder">
            <span class="status" id="kickStatus"></span>
          </div>
          <div class="box">
            <h2 class="row"><img class="plat-logo" src="/assets/platform-logos/twitch.svg" alt=""><span data-i18n="twitchChannel"></span></h2>
            <input type="text" data-f="twitchChannel" maxlength="25" aria-label="Twitch channel" data-placeholder="channelPlaceholder">
            <span class="status" id="twitchStatus"></span>
          </div>
        </div>

        <div class="stage chat-stage">
          <div class="chat-preview"><iframe id="chatPreview" title="Chat preview"></iframe></div>
          <p id="chatFxHint" class="fx-hint" aria-live="polite"></p>
          <div class="stage-ctrl">
            <button id="chatAllFx" data-i18n="chatAllFx"></button>
            <button id="chatBurst" data-i18n="chatBurst"></button>
            <button id="chatTest" class="primary">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span data-i18n="chatTest"></span>
            </button>
          </div>
        </div>

        <div class="box">
          <div class="row between"><h2 data-i18n="chatStyle"></h2><small data-i18n="chatStyleHint"></small></div>
          <div id="chatStyleGrid" class="style-grid five"></div>
        </div>

        <details class="more">
          <summary>
            <span data-i18n="moreOptions"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </summary>
          <div id="chatMore" class="more-grid three"></div>
        </details>
      </section>

      <!-- ===== Theme ===== -->
      <section class="view" data-view="theme" hidden>
        <div class="stack">
          <h1 class="title" data-i18n="themeTitle"></h1>
          <small data-i18n="themeHint"></small>
        </div>
        <div id="themeGrid" class="theme-grid"></div>
      </section>

      <!-- ===== Settings ===== -->
      <section class="view narrow" data-view="settings" hidden>
        <h1 class="title" data-i18n="settings"></h1>
        <div class="box">
          <h2 data-i18n="badgeTitle"></h2>
          <label class="row between toggle-row">
            <span data-i18n="badgeLabel"></span>
            <span class="switch"><input type="checkbox" id="showBadge"><span></span></span>
          </label>
          <small><span data-i18n="badgeHint"></span> <span data-i18n="connected"></span> <b id="connectedList"></b></small>
        </div>
        <div class="box">
          <h2 data-i18n="testTitle"></h2>
          <label class="row between toggle-row"><span data-i18n="testAs"></span><select id="testAs"></select></label>
        </div>
        <div class="box">
          <h2 data-i18n="obsTitle"></h2>
          <small data-i18n="copyObsHint"></small>
          <input id="obsUrl" type="text" readonly aria-label="OBS URL">
        </div>
        <div class="box">
          <h2 data-i18n="resetTitle"></h2>
          <small data-i18n="resetHint"></small>
          <div><button id="resetAll" class="danger" data-i18n="resetAll"></button></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="panel.js"></script>
</body>
</html>
