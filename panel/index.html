<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarchi</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <div class="logo" aria-hidden="true">J</div>
    <h1 data-i18n="title"></h1>
  </header>

  <main>
    <section class="panel">
      <h2 data-i18n="obsTitle"></h2>
      <p class="hint" data-i18n="obsHint"></p>
      <div class="row">
        <input id="obsUrl" type="text" readonly aria-label="OBS URL">
        <button id="copy" class="primary" data-i18n="copy"></button>
      </div>
    </section>

    <section class="panel">
      <h2 data-i18n="themeTitle"></h2>
      <p class="hint" data-i18n="themeHint"></p>
      <div id="themes" class="themes"></div>
    </section>

    <section class="panel">
      <div class="row between">
        <h2 data-i18n="alertsTitle"></h2>
        <div class="row">
          <label class="row inline"><span data-i18n="testAs"></span><select id="testAs"></select></label>
          <button id="resetAll" class="danger" data-i18n="resetAll"></button>
        </div>
      </div>
      <div id="alerts" class="grid"></div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <template id="alertTpl">
    <article class="alert-box">
      <header class="row between">
        <h3 class="name"></h3>
        <label class="switch"><input type="checkbox" data-f="enabled" aria-label="Enabled"><span></span></label>
      </header>
      <div class="body">
        <label class="field">
          <span data-i18n="template"></span>
          <input type="text" data-f="template" maxlength="200">
          <small data-i18n="templateHint"></small>
        </label>
        <div class="cols">
          <label class="field"><span data-i18n="duration"></span><input type="number" data-f="duration" min="1" max="60" step="0.5"></label>
          <label class="field"><span><span data-i18n="volume"></span> <b class="vol"></b></span><input type="range" data-f="volume" min="0" max="1" step="0.05"></label>
          <label class="field min"><span data-i18n="minAmount"></span><input type="number" data-f="minAmount" min="0" step="1"></label>
        </div>
        <div class="file" data-kind="image">
          <span data-i18n="image"></span>
          <div class="row">
            <span class="fname"></span>
            <button class="upload" data-i18n="upload"></button>
            <button class="ghost remove" data-i18n="remove"></button>
            <input type="file" hidden accept="image/png,image/jpeg,image/gif,image/webp,video/webm,.webm">
          </div>
        </div>
        <div class="file" data-kind="sound">
          <span data-i18n="sound"></span>
          <div class="row">
            <span class="fname"></span>
            <button class="upload" data-i18n="upload"></button>
            <button class="ghost remove" data-i18n="remove"></button>
            <input type="file" hidden accept="audio/mpeg,audio/wav,audio/ogg,.mp3,.wav,.ogg">
          </div>
        </div>
        <footer class="row">
          <button class="primary test" data-i18n="test"></button>
          <button class="ghost reset" data-i18n="reset"></button>
        </footer>
      </div>
    </article>
  </template>

  <script src="panel.js"></script>
</body>
</html>
