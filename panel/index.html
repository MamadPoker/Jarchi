<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarchi</title>
  <link rel="stylesheet" href="panel.css">
  <!-- The look kept by panel.js (mode, color theme and System's accent, text size, background art), set before the first
       paint so a light panel doesn't flash dark. System without an accent color is Jarchi. -->
  <script>try {
    const de = document.documentElement, ls = localStorage, accent = JSON.parse(ls.getItem('jarchi.accent'));
    de.dataset.theme = ls.getItem('jarchi.theme') || 'dark';
    de.dataset.palette = ls.getItem('jarchi.palette') || 'jarchi';
    de.dataset.size = ls.getItem('jarchi.size') || 'normal';
    if (ls.getItem('jarchi.art') !== '0') de.dataset.art = '';
    if (accent) for (const k in accent) de.style.setProperty(k, accent[k]);
    else if (de.dataset.palette === 'system') de.dataset.palette = 'jarchi';
  } catch {}</script>
</head>
<body>
  <!-- Background art (Appearance): faint icons and the streamer's pictures behind everything (panel.js fills it). -->
  <div id="bgArt" class="bg-art" aria-hidden="true"></div>
  <div class="app">
    <!-- Sidebar: the brand, then one item per page. Each opens its <section data-view> (select() in panel.js). -->
    <aside class="side">
      <div class="brand" id="brand"></div>
      <nav class="nav" data-aria="menu">
        <button class="nav-item" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="navHome"></span></button>
        <button class="nav-item" data-view="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span data-i18n="groupAlerts"></span></button>
        <button class="nav-item" data-view="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-i18n="chatName"></span></button>
        <button class="nav-item" data-view="goal"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span data-i18n="navGoals"></span></button>
        <h2 class="group-title" data-i18n="navLive"></h2>
        <button class="nav-item" data-view="queue"><svg class="flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span data-i18n="queueTitle"></span><span class="q-count" id="qNavCount" hidden></span></button>
        <button class="nav-item" data-view="events"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5M12 7v5l3 2"/></svg><span data-i18n="navEvents"></span></button>
        <h2 class="group-title" data-i18n="navSetup"></h2>
        <button class="nav-item" data-view="connections"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span data-i18n="navConnections"></span></button>
        <button class="nav-item" data-view="appearance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 1 9-9c0 2-1.6 3-3.2 3H15a1.8 1.8 0 0 0-1.4 2.9A1.8 1.8 0 0 1 12 21zM7.5 11.5h.01M10 7.5h.01M14.5 7.5h.01"/></svg><span data-i18n="navAppearance"></span></button>
        <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.7L10.5 2.1H13.5L13.7 4.7A7.5 7.5 0 0 1 16 5.6L17.9 4L20 6.1L18.4 8A7.5 7.5 0 0 1 19.3 10.3L21.9 10.5V13.5L19.3 13.7A7.5 7.5 0 0 1 18.4 16L20 17.9L17.9 20L16 18.4A7.5 7.5 0 0 1 13.7 19.3L13.5 21.9H10.5L10.3 19.3A7.5 7.5 0 0 1 8 18.4L6.1 20L4 17.9L5.6 16A7.5 7.5 0 0 1 4.7 13.7L2.1 13.5V10.5L4.7 10.3A7.5 7.5 0 0 1 5.6 8L4 6.1L6.1 4L8 5.6A7.5 7.5 0 0 1 10.3 4.7Z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="settings"></span></button>
        <button class="nav-item" data-view="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span data-i18n="guide"></span></button>
      </nav>
    </aside>

    <div class="page">
    <header class="topbar">
      <h1 id="pageTitle" class="page-title"></h1>
      <!-- A Kick / Twitch connection down for over 30 s (renderConnWarn): its alerts may be missed. A click opens where
           it's set up. -->
      <button id="connWarn" class="conn-warn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20zM12 10v4M12 17v.5"/></svg><span></span></button>
      <!-- Kick / Twitch: green dot when the chat connection is up (renderStatus). -->
      <div class="plats">
        <button class="plat" data-p="kick"><img src="/assets/platform-logos/kick.svg" alt=""><i></i></button>
        <button class="plat" data-p="twitch"><img src="/assets/platform-logos/twitch.svg" alt=""><i></i></button>
      </div>
      <!-- Dark / Light. -->
      <div class="mode" role="group" data-aria="colorMode">
        <button data-mode="dark" data-title="modeDark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg></button>
        <button data-mode="light" data-title="modeLight"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
      <div class="lang" role="group" data-aria="language">
        <button data-lang="fa" lang="fa">فا</button><button data-lang="en" lang="en">EN</button>
      </div>
    </header>

    <main>
      <!-- ===== Home: ready to stream?, the last events, widgets open in OBS, goals, today's numbers (renderHome) ===== -->
      <section class="view home" data-view="home" hidden>
        <div id="banner" class="banner">
          <span class="banner-icon">
            <svg class="i-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            <svg class="i-warn" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 16.5h.01"/></svg>
          </span>
          <div class="banner-text">
            <h2 id="bannerTitle"></h2>
            <small id="bannerHint" data-i18n="readyHint"></small>
            <ul id="issues" class="issues"></ul>
          </div>
          <div class="banner-actions">
            <button id="homeTest" class="primary">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
              <span data-i18n="homeTest"></span>
            </button>
            <div class="menu">
              <button id="obsMenuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="obsMenu">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
                <span data-i18n="obsLinks"></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div id="obsMenu" class="menu-pop" hidden></div>
            </div>
          </div>
        </div>

        <div class="home-grid">
          <div class="box feed">
            <div class="row between">
              <h2 data-i18n="feedTitle"></h2>
              <div id="feedChips" class="filters" role="group" data-aria="feedTitle"></div>
            </div>
            <ol id="feedList" class="feed-list"></ol>
            <p id="feedEmpty" class="q-empty" data-i18n="feedEmpty"></p>
            <button id="feedAll" class="link-btn" data-i18n="viewAll"></button>
          </div>
          <div class="home-side">
            <div class="box">
              <!-- Only the widgets that are switched on (alerts always); Manage opens the Goals page. -->
              <div class="row between">
                <h2 data-i18n="widgetsTitle"></h2>
                <button id="widgetsManage" class="link-btn" data-i18n="widgetsManage"></button>
              </div>
              <ul id="widgetList" class="widget-list"></ul>
            </div>
            <!-- Read-only: the goals set on each channel right now, as Kick / Twitch have them (Jarchi's own goals, the syncs
                 and the OBS goal widgets are the Goals page's). -->
            <div class="box tab-box" id="homeGoalsBox">
              <h2 data-i18n="navGoals"></h2>
              <div class="tabs" role="tablist" data-aria="goalSources">
                <button role="tab" id="tab-h-kick" aria-controls="pane-h-kick" data-tab="kick"><img src="/assets/platform-logos/kick.svg" alt=""><span>Kick</span></button>
                <button role="tab" id="tab-h-twitch" aria-controls="pane-h-twitch" data-tab="twitch"><img src="/assets/platform-logos/twitch.svg" alt=""><span>Twitch</span></button>
              </div>
              <div class="pane" role="tabpanel" id="pane-h-kick" aria-labelledby="tab-h-kick" data-tab="kick">
                <div id="kickGoals" class="home-goals"></div>
                <small id="kickGoalsHint"></small>
              </div>
              <div class="pane" role="tabpanel" id="pane-h-twitch" aria-labelledby="tab-h-twitch" data-tab="twitch" hidden>
                <div id="twitchGoals" class="home-goals"></div>
                <small id="twitchGoalsHint"></small>
                <button id="twitchGoalsConnect" class="ghost small-btn" data-i18n="twConnect"></button>
              </div>
            </div>
            <div class="stats">
              <div><b id="statAlerts"></b><small data-i18n="statAlerts"></small></div>
              <div><b id="statChat"></b><small data-i18n="statChat"></small></div>
              <div><b id="statUptime"></b><small data-i18n="statUptime"></small></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== History feed: every saved event, newest first, 20 a page (renderHistory) ===== -->
      <section class="view narrow" data-view="events" hidden>
        <div class="box">
          <div id="histChips" class="filters" role="group" data-aria="navEvents"></div>
          <ol id="histList" class="feed-list"></ol>
          <p id="histEmpty" class="q-empty" data-i18n="feedEmpty"></p>
          <nav id="histPages" class="pager" data-aria="pages"></nav>
        </div>
      </section>

      <!-- ===== Connections: the streamer's own Kick account (follows; renderKick()) and Twitch account (follows, Twitch
           goals; renderTwitch()) ===== -->
      <section class="view narrow connections" data-view="connections" hidden>
        <div class="box">
          <div class="card-head">
            <span class="card-icon"><img src="/assets/platform-logos/kick.svg" alt=""></span>
            <div class="stack"><h2>Kick</h2><span class="status" id="kcState"></span></div>
            <button id="kcConnect" class="primary" data-i18n="kcConnect"></button>
            <button id="kcDisconnect" class="danger"></button>
          </div>
          <small data-i18n="kcWhat"></small>
          <!-- While Kick's login page is open (in another tab). -->
          <div id="kcWait" class="tw-wait" hidden>
            <span data-i18n="kcWaiting"></span>
            <button id="kcOpen" class="primary" data-i18n="kcOpen"></button>
          </div>
        </div>
        <div class="box">
          <div class="card-head">
            <span class="card-icon"><img src="/assets/platform-logos/twitch.svg" alt=""></span>
            <div class="stack"><h2>Twitch</h2><span class="status" id="twState"></span></div>
            <button id="twConnect" class="primary" data-i18n="twConnect"></button>
            <button id="twDisconnect" class="danger"></button>
          </div>
          <small data-i18n="twWhat"></small>
          <!-- While Twitch waits for the streamer to approve: Twitch's code and where to type it. -->
          <div id="twWait" class="tw-wait" hidden>
            <span data-i18n="twEnterCode"></span>
            <b id="twCode" class="tw-code" dir="ltr"></b>
            <button id="twOpen" class="primary" data-i18n="twOpen"></button>
            <small data-i18n="twWaiting"></small>
          </div>
          <label class="field"><span data-i18n="twClientId" data-help="connections.clientId"></span><input type="text" id="twClientId" maxlength="64" spellcheck="false" autocomplete="off"><small data-i18n="twClientHint"></small></label>
        </div>
      </section>

      <!-- ===== Appearance: how this panel looks, in this browser only (the widgets' look is on their own pages).
           No Save button: every change saves by itself (a "Saved" toast). ===== -->
      <section class="view appearance" data-view="appearance" hidden>
        <div class="box">
          <div class="card-head">
            <span class="card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
            <div class="stack"><h2 data-i18n="lookPanel"></h2><small data-i18n="lookPanelHint"></small></div>
          </div>
          <!-- Each color card draws a tiny panel in its theme, in the mode shown now (panel.js). -->
          <div class="field">
            <span data-i18n="colorTheme" data-help="appearance.palette"></span>
            <div id="palettes" class="modes" role="radiogroup" data-aria="colorTheme"></div>
          </div>
        </div>
        <div class="look-grid">
          <div class="box">
            <div class="card-head">
              <span class="card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5h11v2M8.5 5v14M6.5 19h4M14 12v-1.5h7V12M17.5 10.5V19M16 19h3"/></svg></span>
              <div class="stack"><h2 data-i18n="textSize" data-help="appearance.textSize"></h2><small data-i18n="textSizeHint"></small></div>
            </div>
            <div class="modes three" role="radiogroup" data-aria="textSize">
              <label class="mode-card"><input type="radio" name="size" value="small"><span class="mode-body"><span class="sample small" data-i18n="textSample"></span><span data-i18n="sizeSmall"></span></span></label>
              <label class="mode-card"><input type="radio" name="size" value="normal"><span class="mode-body"><span class="sample" data-i18n="textSample"></span><span data-i18n="sizeNormal"></span></span></label>
              <label class="mode-card"><input type="radio" name="size" value="large"><span class="mode-body"><span class="sample large" data-i18n="textSample"></span><span data-i18n="sizeLarge"></span></span></label>
            </div>
          </div>
          <div class="box">
            <div class="card-head">
              <span class="card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3l1.8 4.7 4.7 1.8-4.7 1.8L10 16l-1.8-4.7L3.5 9.5l4.7-1.8zM18 14l.9 2.1 2.1.9-2.1.9L18 20l-.9-2.1-2.1-.9 2.1-.9z"/></svg></span>
              <div class="stack"><h2 data-i18n="bgArt" data-help="appearance.bgArt"></h2><small data-i18n="bgArtHint"></small></div>
              <label class="switch"><input type="checkbox" id="bgArtOn" data-aria="bgArt"><span></span></label>
            </div>
          </div>
          <div class="box">
            <div class="card-head">
              <span class="card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
              <div class="stack"><h2 data-i18n="language" data-help="appearance.language"></h2><small data-i18n="languageHint"></small></div>
            </div>
            <div class="modes two" role="radiogroup" data-aria="language">
              <label class="mode-card"><input type="radio" name="lang" value="fa"><span class="mode-body" lang="fa"><span class="sample">فا</span><span>فارسی</span></span></label>
              <label class="mode-card"><input type="radio" name="lang" value="en"><span class="mode-body" lang="en"><span class="sample">En</span><span>English</span></span></label>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Alerts: the main theme and the OBS link on top, then the alert list (switches, platforms) next to the selected alert:
           its live preview, then its settings in four tabs. No Save button: every change saves by itself (send(), a "Saved" toast). ===== -->
      <section class="view split" data-view="alert" hidden>
        <div class="page-head">
          <button id="themeRow" class="theme-row">
            <span class="group-title" data-i18n="groupTheme"></span>
            <span class="swatch" id="themeSwatch"></span><b id="themeName"></b>
            <span class="swatches" id="themeSwatches"></span>
            <span class="change" data-i18n="change"></span>
          </button>
          <button id="copy">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
            <span data-i18n="copyObs"></span>
          </button>
        </div>
        <div class="split-body">
        <div class="list"><h2 class="group-title" data-i18n="groupAlerts" data-help="groups.alerts"></h2><ul id="alertList" class="nav-list"></ul>
          <!-- For every alert: the Kick / Twitch badge (it needs both accounts connected) -->
          <div class="list-foot">
            <label class="row between toggle-row"><span data-i18n="badgeLabel" data-help="settings.showBadge"></span><span class="switch"><input type="checkbox" id="showBadge"><span></span></span></label>
            <small><span data-i18n="badgeHint"></span> <span data-i18n="connected"></span> <b id="connectedList"></b></small>
          </div>
        </div>
        <div class="editor">
        <div class="row between">
          <h1 class="title"><span class="q-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path/></svg></span><span class="name"></span><span class="pill" data-only="off" data-i18n="off"></span></h1>
          <div class="row">
            <button id="test" data-i18n="testObs"></button>
            <button id="reset" class="ghost" data-i18n="resetAlert"></button>
          </div>
        </div>

        <div class="stage alert-stage">
          <div class="preview" id="previewBox"><iframe id="preview" src="/widgets/alerts/?preview" data-title="alertPreview" allow="autoplay"></iframe></div>
          <div class="stage-bar">
            <!-- Only the preview's background here; OBS shows the alert over the stream. -->
            <div class="seg" role="radiogroup" data-aria="previewBg">
              <label><input type="radio" name="previewBg" value="dark"><span><i class="bg-sw" data-bg="dark"></i><span data-i18n="bgDark"></span></span></label>
              <label><input type="radio" name="previewBg" value="light"><span><i class="bg-sw" data-bg="light"></i><span data-i18n="bgLight"></span></span></label>
              <label><input type="radio" name="previewBg" value="checker"><span><i class="bg-sw" data-bg="checker"></i><span data-i18n="bgChecker"></span></span></label>
            </div>
            <div class="row">
              <label class="pill-ctrl" data-only="amount"><span data-i18n="previewAmount"></span><input type="number" id="previewAmount" min="0" step="1"></label>
              <label class="pill-ctrl"><input type="checkbox" id="previewSound" checked><span data-i18n="previewSound"></span></label>
              <button id="play" class="primary">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/></svg>
                <span data-i18n="replay"></span>
              </button>
            </div>
          </div>
        </div>

        <div class="tabs" role="tablist" data-aria="alertTabs">
          <button role="tab" id="tab-media" aria-controls="pane-media" data-tab="media"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6M15.5 8.5h.01"/></svg><span data-i18n="tabMedia"></span></button>
          <button role="tab" id="tab-sound" aria-controls="pane-sound" data-tab="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span data-i18n="tabSound"></span></button>
          <button role="tab" id="tab-text" aria-controls="pane-text" data-tab="text"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg><span data-i18n="tabText"></span></button>
          <button role="tab" id="tab-style" aria-controls="pane-style" data-tab="style"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 1 9-9c0 2-1.6 3-3.2 3H15a1.8 1.8 0 0 0-1.4 2.9A1.8 1.8 0 0 1 12 21zM7.5 11.5h.01M10 7.5h.01M14.5 7.5h.01"/></svg><span data-i18n="tabStyle"></span></button>
        </div>

        <!-- Media: the picture, how long it plays and from what amount, media by amount -->
        <div class="pane" role="tabpanel" id="pane-media" aria-labelledby="tab-media" data-tab="media">
          <div class="box">
            <h2 data-i18n="mediaTitle" data-help="alert.media"></h2>
            <div class="file" data-kind="image">
              <span class="fname"></span>
              <div class="row">
                <button class="upload" data-i18n="upload"></button>
                <button class="ghost remove" data-i18n="remove"></button>
              </div>
              <input type="file" hidden accept="image/png,image/jpeg,image/gif,image/webp,video/webm,video/mp4,.webm,.mp4">
            </div>
            <small data-i18n="mediaHint"></small>
          </div>

          <div class="box">
            <h2 data-i18n="playbackTitle"></h2>
            <div class="cols">
              <label class="field"><span data-i18n="duration" data-help="alert.duration"></span><input type="number" data-f="duration" min="1" max="60" step="0.5"></label>
              <label class="field" data-only="minAmount"><span data-i18n="minAmount" data-help="alert.minAmount"></span><input type="number" data-f="minAmount" min="0" step="1"></label>
            </div>
            <small data-only="minAmount" data-i18n="scaleHint"></small>
          </div>

          <!-- Media by amount (Kicks, gifted subs, bits): fixed tiers, built in panel.js (renderTiers). -->
          <div class="box wide" data-only="tiers">
            <label class="row between toggle-row">
              <span class="stack"><b data-i18n="tiersTitle" data-help="alert.tiers"></b><small data-i18n="tiersHint"></small></span>
              <span class="switch"><input type="checkbox" data-f="tiersOn"><span></span></span>
            </label>
            <small data-only="tiersOn" data-i18n="tiersRule"></small>
            <div id="tiers" class="tiers" data-only="tiersOn"></div>

              <button role="tab" id="tab-c-layout" aria-controls="pane-c-layout" data-tab="layout"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg><span data-i18n="tabLayout"></span></button>
            </div>
            <div class="pane" role="tabpanel" id="pane-c-text" aria-labelledby="tab-c-text" data-tab="text"></div>
            <div class="pane" role="tabpanel" id="pane-c-names" aria-labelledby="tab-c-names" data-tab="names" hidden></div>
            <div class="pane" role="tabpanel" id="pane-c-events" aria-labelledby="tab-c-events" data-tab="events" hidden></div>
            <div class="pane" role="tabpanel" id="pane-c-filters" aria-labelledby="tab-c-filters" data-tab="filters" hidden></div>
            <div class="pane" role="tabpanel" id="pane-c-layout" aria-labelledby="tab-c-layout" data-tab="layout" hidden></div>
          </div>
        </div>
      </section>

      <!-- ===== Theme ===== -->
      <section class="view" data-view="theme" hidden>
        <div class="stack">
          <h1 class="title" data-i18n="themeTitle" data-help="theme.main"></h1>
          <small data-i18n="themeHint"></small>
        </div>
        <div id="themeGrid" class="theme-grid"></div>
      </section>

      <!-- ===== Settings ===== -->
      <section class="view narrow" data-view="settings" hidden>
        <div class="box">
          <h2 data-i18n="testTitle"></h2>
          <label class="row between toggle-row"><span data-i18n="testAs" data-help="settings.testAs"></span><select id="testAs"></select></label>
        </div>
        <div class="box">
          <h2 data-i18n="queueTitle"></h2>
          <label class="row between toggle-row"><span data-i18n="alertGap" data-help="settings.alertGap"></span><input type="number" id="alertGap" class="num" min="0" max="60" step="0.5"></label>
          <small data-i18n="queueHint"></small>
        </div>
        <div class="box">
          <h2 data-i18n="proxyTitle" data-help="settings.proxyMode"></h2>
          <small data-i18n="proxyHint"></small>
          <div class="seg">
            <label><input type="radio" name="proxyMode" value="off"><span data-i18n="proxyOff"></span></label>
            <label><input type="radio" name="proxyMode" value="system"><span data-i18n="proxySystem"></span></label>
            <label><input type="radio" name="proxyMode" value="manual"><span data-i18n="proxyManual"></span></label>
          </div>
          <small id="proxyNow" data-only="proxySystem"></small>
          <div class="proxy-manual" data-only="proxyManual">
            <div class="field">
              <span data-i18n="proxyType" data-help="settings.proxyType"></span>
              <div class="seg">
                <label><input type="radio" name="proxyType" value="http"><span>HTTP</span></label>
                <label><input type="radio" name="proxyType" value="socks5"><span>SOCKS5</span></label>
              </div>
            </div>
            <label class="field"><span data-i18n="proxyHost" data-help="settings.proxyHost"></span><input type="text" id="proxyHost" maxlength="253" placeholder="127.0.0.1"></label>
            <label class="field"><span data-i18n="proxyPort" data-help="settings.proxyPort"></span><input type="number" id="proxyPort" min="1" max="65535" step="1" placeholder="10808"></label>
          </div>
          <div class="row">
            <button id="netTest">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01M2 9a14 14 0 0 1 20 0"/></svg>
              <span data-i18n="netTest"></span>
            </button>
            <small id="netUsing"></small>
          </div>
          <ul id="netResults" class="net-results"></ul>
        </div>
        <div class="box">
          <h2 data-i18n="obsTitle" data-help="settings.obsUrl"></h2>
          <small data-i18n="copyObsHint"></small>
          <input id="obsUrl" type="text" readonly data-aria="obsTitle">
        </div>
        <div class="box">
          <h2 data-i18n="resetTitle" data-help="settings.reset"></h2>
          <small data-i18n="resetHint"></small>
          <div><button id="resetAll" class="danger" data-i18n="resetAll"></button></div>
        </div>
      </section>

      <!-- ===== Guide: its own topic list; the text is in i18n guide.topics (renderGuide) ===== -->
      <section class="view" data-view="guide" hidden>
        <div class="guide">
          <nav id="guideTopics" class="guide-topics" data-aria="guideTopics"></nav>
          <article id="guideBody" class="guide-body"></article>
        </div>
      </section>

      <!-- ===== Alert queue (core/alerts.js): now playing, Pause / Skip / Clear, waiting, last played ===== -->
      <section id="queue" class="view narrow" data-view="queue" hidden>
        <p id="qNoObs" class="q-notice" data-i18n="qNoObs" hidden></p>
        <div class="box q-sec">
          <h3><span data-i18n="qNow"></span> <span class="pill" id="qPaused" data-i18n="qPausedLabel" hidden></span></h3>
          <div id="qNow" class="q-now" aria-live="polite"></div>
          <div class="q-bar"><i id="qBar"></i></div>
          <div class="q-buttons">
            <button id="qPause">
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
              <span></span>
            </button>
            <button id="qSkip" data-title="qSkipHint">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l10 7-10 7zM19 5v14"/></svg>
              <span data-i18n="qSkip"></span>
            </button>
            <button id="qClear" class="ghost">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
              <span data-i18n="qClear"></span>
            </button>
          </div>
        </div>
        <div class="box q-sec">
          <h3><span data-i18n="qWaitingTitle"></span> <span class="q-count" id="qCount"></span></h3>
          <ol id="qList" class="q-list"></ol>
          <p id="qEmpty" class="q-empty" data-i18n="qEmpty"></p>
        </div>
        <div class="box q-sec">
          <h3 data-i18n="qHistory"></h3>
          <ol id="qHistory" class="q-list"></ol>
          <p id="qNoHistory" class="q-empty" data-i18n="qNoHistory"></p>
        </div>
      </section>
    </main>
    </div>
  </div>

  <div id="tip" role="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="panel.js"></script>
</body>
</html>
