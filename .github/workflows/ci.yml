# CI: every PR and every push to main. "✅ CI OK" is the one check main's ruleset requires; it fails when any job
# below failed (a skipped one is fine).
#   tests      npm test
#   pr         the PR title is a conventional commit; feat / fix / perf add What's new lines (build/check-pr.js)
#   installer  the Windows installer still packs (electron-builder --dir), when packaging files changed
#   relay      the relay still builds (wrangler deploy --dry-run), when relay/ changed
name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the tests don't start Electron

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.diff.outputs.packaging }}
      relay: ${{ steps.diff.outputs.relay }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🗂️ Changed files
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD)
          if grep -qE '^(package(-lock)?\.json|build/|electron/)' <<<"$files"; then echo packaging=true >> "$GITHUB_OUTPUT"; fi
          if grep -q '^relay/' <<<"$files"; then echo relay=true >> "$GITHUB_OUTPUT"; fi

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🟢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install
        run: npm ci
      - name: 🧪 Tests
        run: npm test

  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🟢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 📋 PR title and What's new
        run: node build/check-pr.js
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event.pull_request.base.sha }}

  installer:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '' # electron-builder needs Electron here
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # not signed (no certificate yet)
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🟢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install
        run: npm ci
      - name: 📝 Release notes (latest.yml)
        run: node build/notes.js
      - name: 🏗️ Pack the installer (no upload)
        run: npx electron-builder --win --dir --publish never

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🟢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: ☁️ Relay builds (dry run)
        run: npx --yes wrangler@4.160.1 deploy --dry-run

  ci-ok:
    name: ✅ CI OK
    needs: [changes, tests, pr, installer, relay]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ❌ A check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: ✅ All checks passed
        run: echo "All checks passed (skipped ones didn't apply)."
