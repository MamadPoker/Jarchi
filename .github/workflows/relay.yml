# Deploy relay: by hand only (Actions -> Deploy relay -> Run workflow, on main). Applies relay/migrations that D1
# doesn't have yet, THEN deploys the worker (the new worker may need the new tables). dry-run: lists the pending
# migrations and builds the worker, changes nothing. The Kick keys and ADMIN_KEY stay Worker secrets in Cloudflare
# (wrangler secret put); GitHub only holds a Cloudflare API token for this account.
name: Deploy relay

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only list pending migrations and build the worker
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    # main only. The real guard is the "relay" environment: its deployment-branch policy (main) is what hands out the
    # Cloudflare secrets, so a copy of this file on another branch, with this if taken out, still gets none.
    if: github.ref == 'refs/heads/main'
    environment: relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.160.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: inputs.dry-run
        run: |
          $WRANGLER d1 migrations list jarchi-stats --remote
          $WRANGLER deploy --dry-run
      - if: ${{ !inputs.dry-run }}
        run: |
          $WRANGLER d1 migrations apply jarchi-stats --remote
          $WRANGLER deploy
